name: 'Fetch Root Manager APKs'
description: 'Download the matching official root manager APK for SukiSU-Ultra or KernelSU-Next'
inputs:
  flavor:
    description: 'Root flavor (default: SukiSU-Ultra)'
    required: false
    default: 'SukiSU-Ultra'
  output_dir:
    description: 'Absolute path of directory to place downloaded APKs'
    required: false
    default: '${{ github.workspace }}/root-managers'
  token:
    description: 'GitHub token for API authentication'
    required: false
    default: '${{ github.token }}'

runs:
  using: composite
  steps:
    - name: Download Root Manager APKs
      shell: bash
      run: |
        set -euo pipefail

        OUT_DIR="${{ inputs.output_dir }}"
        export GH_TOKEN="${{ inputs.token }}"
        FLAVOR="${{ inputs.flavor }}"
        mkdir -p "$OUT_DIR" /tmp/manager-dl
        cd /tmp/manager-dl

        case "$FLAVOR" in
          SukiSU-Ultra)
            OWNER="SukiSU-Ultra"
            REPO="SukiSU-Ultra"
            ;;
          KernelSU-Next)
            OWNER="KernelSU-Next"
            REPO="KernelSU-Next"
            ;;
          *)
            echo "::error::Unsupported root manager flavor: $FLAVOR" >&2
            exit 1
            ;;
        esac

        echo "[+] Fetching latest release assets for ${OWNER}/${REPO}..."
        RELEASE_JSON=""
        if command -v gh >/dev/null 2>&1; then
          RELEASE_JSON="$(gh api "repos/${OWNER}/${REPO}/releases/latest" 2>/dev/null || true)"
        fi
        if [ -z "$RELEASE_JSON" ]; then
          RELEASE_JSON="$(curl -fsSL --retry 5 --retry-delay 3 \
            -H 'Accept: application/vnd.github+json' -H 'User-Agent: gki-kernel-builder' \
            "https://api.github.com/repos/${OWNER}/${REPO}/releases/latest")"
        fi

        if [ "$FLAVOR" = "KernelSU-Next" ]; then
          URLS="$(jq -r '.assets[]? | select((.name | startswith("KernelSU_Next_")) and (.name | endswith(".apk")) and ((.name | ascii_downcase | contains("spoofed")) | not) and ((.name | ascii_downcase | contains("debug")) | not)) | .browser_download_url' <<< "$RELEASE_JSON")"
        else
          URLS="$(jq -r '.assets[]? | select((.name | ascii_downcase | endswith(".apk")) and ((.name | ascii_downcase | contains("debug")) | not)) | .browser_download_url' <<< "$RELEASE_JSON")"
        fi

        if [ -z "$URLS" ]; then
          echo "::error::No eligible Manager APK found in latest ${OWNER}/${REPO} release for ${FLAVOR}." >&2
          exit 1
        fi

        while IFS= read -r URL; do
          [ -z "$URL" ] && continue
          FILENAME="${URL##*/}"
          echo "[+] Downloading official Manager APK: $FILENAME"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "/tmp/manager-dl/$FILENAME" "$URL"
          cp -f "/tmp/manager-dl/$FILENAME" "$OUT_DIR/$FILENAME"
          echo "[+] Saved $OUT_DIR/$FILENAME"
        done <<< "$URLS"

        rm -rf /tmp/manager-dl

    - name: List Fetched Manager APKs
      shell: bash
      run: |
        echo "::group::Fetched Manager APKs"
        find "${{ inputs.output_dir }}" -maxdepth 2 -type f -name '*.apk' -ls
        echo "::endgroup::"
