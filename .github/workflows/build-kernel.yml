name: Build Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        type: choice
        options:
          - Pre-Release
          - Release
        default: Pre-Release
      commit_mode:
        description: "latest = branch tips, verified = audited pins, update = build latest then promote verified pins on success"
        required: false
        type: choice
        options:
          - verified
          - latest
          - update
        default: verified
      kernel_target:
        description: "Android 16 GKI kernel source version"
        type: choice
        options:
          - 6.12.38
          - 6.12.30
        default: 6.12.38
        required: true
      root_flavor:
        description: "Kernel root implementation and matching manager"
        type: choice
        options:
          - SukiSU-Ultra
          - KernelSU-Next
        default: SukiSU-Ultra
        required: true
      ksu_branch:
        description: "Custom branch/tag/commit for the selected root implementation (empty = default)"
        type: string
        required: false
        default: ""
      use_nomount:
        description: "NoMount"
        type: boolean
        default: true
      use_bbg:
        description: "Baseband Guard"
        type: boolean
        default: true
      use_net:
        description: "Networking"
        type: boolean
        default: true
      use_droidspaces:
        description: "DroidSpaces"
        type: boolean
        default: true
      use_ntsync:
        description: "NTSync"
        type: boolean
        default: true
      use_ptrace:
        description: "Ptrace Patch"
        type: boolean
        default: true
      use_unicode:
        description: "Unicode Fix"
        type: boolean
        default: true
      use_bpf:
        description: "BPF Stack (BTF + eBPF + FUSE-BPF)"
        type: boolean
        default: true
      use_perf:
        description: "Performance"
        type: boolean
        default: true
      use_nethunter:
        description: "Kali NetHunter"
        type: boolean
        default: true
      use_cifs:
        description: "CIFS"
        type: boolean
        default: true
      use_cache:
        description: "Use ccache/bazel cache (restore/save)"
        type: boolean
        default: true

jobs:
  resolve-sources:
    name: "Resolve Component Commits"
    runs-on: ubuntu-latest
    outputs:
      nomount_commit: ${{ steps.resolve.outputs.nomount_commit }}
      susfs_commit: ${{ steps.resolve.outputs.susfs_commit }}
      root_matrix: ${{ steps.resolve.outputs.root_matrix }}
      ultra_commit: ${{ steps.resolve.outputs.ultra_commit }}
      next_commit: ${{ steps.resolve.outputs.next_commit }}
      next_dev_commit: ${{ steps.resolve.outputs.next_dev_commit }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve commits per commit_mode
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_MODE="${{ inputs.commit_mode }}"
          echo "Commit Mode: $COMMIT_MODE"

          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          resolve_sha() {
            retry git ls-remote "$1" "$2" | awk '{print $1; exit}'
          }

          emit() {
            if [ -z "$2" ] || ! [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Failed to resolve $1 (got: ${2:-empty})" >&2
              exit 1
            fi
            echo "$1=$2" >> "$GITHUB_OUTPUT"
            echo "  $1=$2"
          }

          # Read verified pins from config
          COMMITS_FILE=".github/config/commits.json"
          PIN_NOMOUNT=$(jq -r '.nomount.dev // empty' "$COMMITS_FILE" 2>/dev/null || echo "09257d7bee031f35124ed7a39e6094a4395d5746")
          PIN_SUSFS=$(jq -r '."susfs"."gki-android16-6.12" // empty' "$COMMITS_FILE" 2>/dev/null || echo "fb58aef70a9c2aca8f0f85fba14017af94c4e789")
          PIN_ULTRA=$(jq -r '."sukisu_ultra"."main" // empty' "$COMMITS_FILE" 2>/dev/null || echo "9fbe8fe8ca90c62c259c5894bf96d02ac31209b9")
          PIN_NEXT_STABLE=$(jq -r '."kernel_su_next"."v3.4.2" // empty' "$COMMITS_FILE")
          PIN_NEXT_DEV=$(jq -r '."kernel_su_next"."dev" // empty' "$COMMITS_FILE")

          pick() {
            local pinned="$1" repo="$2" ref="$3"
            if [ "$COMMIT_MODE" = "verified" ] && [ -n "$pinned" ]; then
              echo "$pinned"
            else
              resolve_sha "$repo" "$ref"
            fi
          }

          echo "Resolving dependencies..."
          emit nomount_commit "$(pick "$PIN_NOMOUNT" https://github.com/maxsteeel/nomount.git refs/heads/dev)"
          if [ "${{ inputs.root_flavor }}" = "SukiSU-Ultra" ]; then
            emit susfs_commit "$(pick "$PIN_SUSFS" https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android16-6.12)"
          else
            echo "susfs_commit=" >> "$GITHUB_OUTPUT"
          fi

          mk_entry() {
            jq -cn --arg flavor "$1" --arg ref "$2" --arg commit "$3" '{flavor:$flavor,ref:$ref,commit:$commit}'
          }

          ROOT_FLAVOR="${{ inputs.root_flavor }}"
          CUSTOM_REF="${{ inputs.ksu_branch }}"
          case "$ROOT_FLAVOR" in
            SukiSU-Ultra)
              ROOT_REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
              DEFAULT_REF="main"
              DEFAULT_REMOTE_REF="refs/heads/main"
              ;;
            KernelSU-Next)
              ROOT_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
              if [ "$COMMIT_MODE" = "verified" ]; then
                DEFAULT_REF="v3.4.2"
                DEFAULT_REMOTE_REF="refs/tags/v3.4.2"
              else
                DEFAULT_REF="dev"
                DEFAULT_REMOTE_REF="refs/heads/dev"
              fi
              ;;
            *)
              echo "Unsupported root flavor: $ROOT_FLAVOR" >&2
              exit 1
              ;;
          esac

          ROOT_PIN=""
          ROOT_SHA=""
          if [ -n "$CUSTOM_REF" ]; then
            if [[ "$CUSTOM_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
              ROOT_REF="$CUSTOM_REF"
              ROOT_SHA="${CUSTOM_REF,,}"
            else
              case "$CUSTOM_REF" in
                refs/heads/*)
                  ROOT_REF="${CUSTOM_REF#refs/heads/}"
                  ROOT_REMOTE_REF="$CUSTOM_REF"
                  ;;
                refs/tags/*)
                  ROOT_REF="${CUSTOM_REF#refs/tags/}"
                  ROOT_REMOTE_REF="$CUSTOM_REF"
                  ;;
                *)
                  ROOT_REF="$CUSTOM_REF"
                  if git ls-remote "$ROOT_REPO" "refs/heads/$ROOT_REF" | grep -q .; then
                    ROOT_REMOTE_REF="refs/heads/$ROOT_REF"
                  elif git ls-remote "$ROOT_REPO" "refs/tags/$ROOT_REF" | grep -q .; then
                    ROOT_REMOTE_REF="refs/tags/$ROOT_REF"
                  else
                    echo "Custom root ref not found: $CUSTOM_REF" >&2
                    exit 1
                  fi
                  ;;
              esac
              if [ "$ROOT_FLAVOR" = "SukiSU-Ultra" ]; then
                ROOT_PIN=$(jq -r --arg ref "$ROOT_REF" '."sukisu_ultra"[$ref] // empty' "$COMMITS_FILE")
              else
                ROOT_PIN=$(jq -r --arg ref "$ROOT_REF" '."kernel_su_next"[$ref] // empty' "$COMMITS_FILE")
              fi
              ROOT_SHA="$(pick "$ROOT_PIN" "$ROOT_REPO" "$ROOT_REMOTE_REF")"
            fi
          else
            ROOT_REF="$DEFAULT_REF"
            ROOT_REMOTE_REF="$DEFAULT_REMOTE_REF"
            if [ "$ROOT_FLAVOR" = "SukiSU-Ultra" ]; then
              ROOT_PIN="$PIN_ULTRA"
            elif [ "$ROOT_REF" = "v3.4.2" ]; then
              ROOT_PIN="$PIN_NEXT_STABLE"
            else
              ROOT_PIN="$PIN_NEXT_DEV"
            fi
            ROOT_SHA="$(pick "$ROOT_PIN" "$ROOT_REPO" "$ROOT_REMOTE_REF")"
          fi

          ULTRA_SHA=""
          NEXT_SHA=""
          NEXT_DEV_SHA=""
          if [ "$ROOT_FLAVOR" = "SukiSU-Ultra" ]; then
            ULTRA_SHA="$ROOT_SHA"
          else
            NEXT_SHA="$ROOT_SHA"
            if [ "$COMMIT_MODE" = "update" ] && [ "$ROOT_REF" = "dev" ] && [ -z "$CUSTOM_REF" ]; then
              NEXT_DEV_SHA="$ROOT_SHA"
            fi
          fi

          if ! [[ "$ROOT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved root commit is not a full 40-character SHA: $ROOT_SHA" >&2
            exit 1
          fi

          ROOT_MATRIX="[$(mk_entry "$ROOT_FLAVOR" "$ROOT_REF" "$ROOT_SHA")]"
          echo "ultra_commit=$ULTRA_SHA" >> "$GITHUB_OUTPUT"
          echo "next_commit=$NEXT_SHA" >> "$GITHUB_OUTPUT"
          echo "next_dev_commit=$NEXT_DEV_SHA" >> "$GITHUB_OUTPUT"
          echo "root_matrix=$ROOT_MATRIX" >> "$GITHUB_OUTPUT"
          echo "Generated Root Matrix: $ROOT_MATRIX"

  build-nomount-module:
    name: "Build NoMount Metamodule"
    needs: [resolve-sources]
    if: ${{ inputs.use_nomount }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build NoMount metamodule
        id: nomount-metamodule
        uses: ./.github/actions/nomount-metamodule
        with:
          commit: ${{ needs.resolve-sources.outputs.nomount_commit }}

      - name: Upload NoMount metamodule
        uses: actions/upload-artifact@v7
        with:
          name: NoMount-Metamodule
          path: ${{ steps.nomount-metamodule.outputs.module_path }}
          if-no-files-found: error
          compression-level: 0

  build-kernel:
    name: "Build Kernel (${{ matrix.flavor }})"
    needs: [resolve-sources, build-nomount-module]
    if: ${{ needs.resolve-sources.result == 'success' && (needs.build-nomount-module.result == 'success' || needs.build-nomount-module.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-sources.outputs.root_matrix) }}
    env:
      VERSION: "android16-6.12"
      ANDROID_VERSION: "android16"
      KERNEL_VERSION: "6.12"
      SUBLEVEL: ${{ inputs.kernel_target == '6.12.38' && '38' || '30' }}
      OS_PATCH_LEVEL: ${{ inputs.kernel_target == '6.12.38' && '2025-09' || '2025-07' }}
      VARIANT: "Normal"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Free Disk Space
        uses: ./.github/actions/disk-cleanup

      - name: Setup more Swap (for LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: "android16-6.12"
          sublevel: ${{ env.SUBLEVEL }}
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}

      - name: Download Kernel Repository
        uses: ./.github/actions/download-kernel
        with:
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          os_patch_level: ${{ env.OS_PATCH_LEVEL }}
          common_revision: ${{ inputs.kernel_target == '6.12.38' && '4ef93a700ec424fe0d4f7d133e7ba50e4dbf0e36' || '' }}
          common_upstream: ${{ inputs.kernel_target == '6.12.38' && 'refs/tags/android16-6.12-2025-09_r39' || '' }}

      - name: Build FUSE-BPF Userspace Daemon
        if: ${{ inputs.use_bpf }}
        continue-on-error: true
        uses: ./.github/actions/fuse-bpf
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          android_version: "android16"

      - name: Set Build Timestamp from Kernel Commit
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git -C "${{ github.workspace }}/kernel/common" log -1 --format=%ct)"
          if ! [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]; then
            echo "Could not derive reproducible timestamp from kernel/common HEAD" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
          KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
          echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
          GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
          echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

      - name: Extract Sublevel and Set File Name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: "android16"
          kernel_version: "6.12"
          sublevel: ${{ env.SUBLEVEL }}
          os_patch_level: ${{ env.OS_PATCH_LEVEL }}
          variant: "Normal"

      - name: Verify Requested Kernel Version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ env.SUBLEVEL }}"
          ACTUAL="${{ steps.extract.outputs.sublevel }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Requested ${{ inputs.kernel_target }} but kernel/common Makefile reports 6.12.$ACTUAL" >&2
            exit 1
          fi
          echo "Verified kernel source version: 6.12.$ACTUAL"

      - name: Download NoMount Metamodule Artifact
        if: ${{ inputs.use_nomount }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: NoMount-Metamodule
          path: ${{ github.workspace }}/nomount-dist

      - name: Kernel Fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ env.OS_PATCH_LEVEL }}

      - name: Setup Root Implementation
        uses: ./.github/actions/kernelsu
        with:
          flavor: ${{ matrix.flavor }}
          ksu_branch: ${{ matrix.ref }}
          commit: ${{ matrix.commit }}

      - name: SUSFS
        if: ${{ matrix.flavor == 'SukiSU-Ultra' }}
        uses: ./.github/actions/susfs
        with:
          susfs_commit: ${{ needs.resolve-sources.outputs.susfs_commit }}
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          os_patch_level: ${{ env.OS_PATCH_LEVEL }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          root_flavor: ${{ matrix.flavor }}

      - name: Fix selinux_hide static declarations & pointer-bool-conversion on 6.12
        if: ${{ matrix.flavor == 'SukiSU-Ultra' }}
        shell: bash
        run: |
          set -euo pipefail
          for f in $(find "${{ github.workspace }}/kernel" -name selinux_hide.c 2>/dev/null); do
            echo "[INFO] Fixing extern symbol linkage and Clang warnings in $f..."
            sed -i 's/^static int security_context_to_sid_with_policy/int security_context_to_sid_with_policy/g' "$f"
            sed -i 's/^static int security_sid_to_context_with_policy/int security_sid_to_context_with_policy/g' "$f"
            sed -i 's/^static void security_compute_av_user_with_policy/void security_compute_av_user_with_policy/g' "$f"
            sed -i 's/^static void __nocfi security_compute_av_user_with_policy/void __nocfi security_compute_av_user_with_policy/g' "$f"
            if grep -q "extern void security_dump_masked_av_fn" "$f"; then
              echo "[INFO] $f is extern-function form, patching with &"
              sed -i 's/if (security_dump_masked_av_fn)/if (\&security_dump_masked_av_fn)/g' "$f"
              sed -i 's/if (security_dump_masked_av_fn != NULL)/if (\&security_dump_masked_av_fn != NULL)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn)/if (\&context_struct_compute_av_fn)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn != NULL)/if (\&context_struct_compute_av_fn != NULL)/g' "$f"
            elif grep -q "if (security_dump_masked_av_fn" "$f"; then
              echo "[INFO] $f is pointer form, patching with != NULL"
              sed -i 's/if (security_dump_masked_av_fn)/if (security_dump_masked_av_fn != NULL)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn)/if (context_struct_compute_av_fn != NULL)/g' "$f"
            fi
          done

      - name: Baseband Guard
        if: ${{ inputs.use_bbg }}
        uses: ./.github/actions/bbg

      - name: Setup Networking
        if: ${{ inputs.use_net }}
        uses: ./.github/actions/networking
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          android_version: "android16"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Setup NetHunter & Wireless Drivers
        if: ${{ inputs.use_nethunter }}
        uses: ./.github/actions/nethunter
        with:
          version: "android16-6.12"

      - name: DroidSpaces-OSS Patches
        if: ${{ inputs.use_droidspaces }}
        uses: ./.github/actions/droidspaces
        with:
          version: "android16-6.12"
          kernel_version: "6.12"

      - name: Apply NTSync Patches
        if: ${{ inputs.use_ntsync }}
        uses: ./.github/actions/ntsync
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Ptrace Patch
        if: ${{ inputs.use_ptrace }}
        uses: ./.github/actions/ptrace
        with:
          kernel_version: "6.12"

      - name: Apply Unicode Fix Patch
        if: ${{ inputs.use_unicode }}
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: "6.12"

      - name: Apply Performance Patches
        if: ${{ inputs.use_perf }}
        uses: ./.github/actions/performance
        with:
          kernel_version: "6.12"

      - name: Setup CIFS
        if: ${{ inputs.use_cifs }}
        uses: ./.github/actions/cifs

      - name: Setup Misc Configs
        uses: ./.github/actions/misc

      - name: Enable BTF
        if: ${{ inputs.use_bpf }}
        uses: ./.github/actions/btf
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Device-Specific Patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: "android16-6.12"
          kernel_version: "6.12"

      - name: Integrate NoMount
        if: ${{ inputs.use_nomount }}
        uses: ./.github/actions/nomount
        with:
          commit: ${{ needs.resolve-sources.outputs.nomount_commit }}
          kernel_version: "6.12"

      - name: Apply Kernel Branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: "Normal"
          kernel_version: "6.12"
          android_version: "android16"
          version: "android16-6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Remove Protected Exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean Kernel Flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan and collect patch rejects
        id: scan
        if: ${{ always() }}
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload Rejects
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: 'Setup Cache and Build Environment'
        if: ${{ inputs.use_cache }}
        uses: ./.github/actions/cache-setup
        with:
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Build Kernel (with Vendor Module Bypass)
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          version: "android16-6.12"

      - name: 📦 Build NetHunter Wireless Module
        if: ${{ inputs.use_nethunter }}
        uses: ./.github/actions/nethunter-module
        with:
          file_name: ${{ steps.extract.outputs.file_name }}

      - name: 📦 Upload NetHunter Module Artifact
        if: ${{ inputs.use_nethunter }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-NetHunter-Wireless-Modules
          path: ${{ github.workspace }}/Nethunter-Wireless-Modules.zip
          if-no-files-found: warn
          compression-level: 0

      - name: 📱 Fetch Matching Root Manager APK
        uses: ./.github/actions/fetch-root-managers
        with:
          flavor: ${{ matrix.flavor }}
          output_dir: ${{ github.workspace }}/root-managers

      - name: Upload Root Manager APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-Manager
          path: ${{ github.workspace }}/root-managers/
          if-no-files-found: warn
          compression-level: 0

      - name: 📋 Generate Build Summary
        if: ${{ always() }}
        shell: bash
        run: |
          SUMMARY_BASE="${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}"
          SUMMARY_FILE="/tmp/build-summary-${SUMMARY_BASE}.md"
          echo "SUMMARY_BASE=${SUMMARY_BASE}" >> "$GITHUB_ENV"

          if [ "${{ job.status }}" = "success" ]; then
            STATUS="[+] Success"
          else
            STATUS="[-] Failed"
          fi

          cat << 'EOF' > "$SUMMARY_FILE"
          # GKI Kernel Build Summary

          ## Status: __STATUS__
          - **Kernel Version:** ${{ inputs.kernel_target }}-android16
          - **OS Patch Level:** ${{ env.OS_PATCH_LEVEL }}
          - **Root Flavor:** __ROOT_FLAVOR__
          - **SUSFS Integration:** __SUSFS_STATUS__
          - **Vendor Bypass:** Baked In (Default)
          - **Commit Mode:** __COMMIT_MODE__
          - **Patch Rejects:** __REJ_STATUS__
          - **NoMount Metamodule:** __NOMOUNT_STATUS__
          - **NetHunter Module:** __NETHUNTER_STATUS__
          - **Performance Patches:** __PERF_STATUS__
          - **BPF Stack:** __BPF_STATUS__
          EOF
          sed -i 's/^[[:space:]]*//' "$SUMMARY_FILE"

          REJ_COUNT="${{ steps.scan.outputs.rej_count || '0' }}"
          if [ "$REJ_COUNT" -eq 0 ] 2>/dev/null; then
            REJ_DISPLAY="0 (Clean)"
          else
            REJ_DISPLAY="⚠️ ${REJ_COUNT} rejects (Check Rejects artifact)"
          fi

          sed -i "s/__STATUS__/${STATUS}/g" "$SUMMARY_FILE"
          sed -i "s/__ROOT_FLAVOR__/${{ matrix.flavor }}/g" "$SUMMARY_FILE"
          if [ "${{ matrix.flavor }}" = "SukiSU-Ultra" ]; then
            SUSFS_STATUS="in-tree SUSFS patch and root hooks enabled"
          else
            SUSFS_STATUS="not applied: SukiSU-specific in-tree patch is incompatible with KernelSU-Next upstream"
          fi
          sed -i "s/__SUSFS_STATUS__/${SUSFS_STATUS}/g" "$SUMMARY_FILE"
          sed -i "s/__COMMIT_MODE__/${{ inputs.commit_mode }}/g" "$SUMMARY_FILE"
          sed -i "s/__REJ_STATUS__/${REJ_DISPLAY}/g" "$SUMMARY_FILE"
          sed -i "s/__NOMOUNT_STATUS__/${{ inputs.use_nomount }}/g" "$SUMMARY_FILE"
          sed -i "s/__NETHUNTER_STATUS__/${{ inputs.use_nethunter }}/g" "$SUMMARY_FILE"
          sed -i "s/__PERF_STATUS__/${{ inputs.use_perf }}/g" "$SUMMARY_FILE"
          sed -i "s/__BPF_STATUS__/${{ inputs.use_bpf }}/g" "$SUMMARY_FILE"

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Summary Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SUMMARY_BASE }}-Summary
          path: /tmp/build-summary-*.md
          if-no-files-found: ignore
          compression-level: 9

      - name: Upload AnyKernel3 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-AnyKernel3
          path: AnyKernel3/
          if-no-files-found: error
          compression-level: 9

      - name: Package NoMount Module
        if: ${{ inputs.use_nomount }}
        shell: bash
        run: |
          set -euo pipefail
          NOMOUNT_DIR="${{ github.workspace }}/nomount-dist"
          TARGET_ZIP="$NOMOUNT_DIR/NoMount-${{ steps.extract.outputs.file_name }}.zip"
          mkdir -p "$NOMOUNT_DIR"

          # 1. Check if a compiled NoMount metamodule ZIP was downloaded
          FOUND_ZIP=""
          for z in "$NOMOUNT_DIR"/NoMount-*.zip "$NOMOUNT_DIR"/*.zip; do
            if [ -f "$z" ]; then
              FOUND_ZIP="$z"
              break
            fi
          done

          if [ -n "$FOUND_ZIP" ]; then
            echo "[+] Found compiled NoMount metamodule: $FOUND_ZIP"
            if [ "$FOUND_ZIP" != "$TARGET_ZIP" ]; then
              cp -f "$FOUND_ZIP" "$TARGET_ZIP"
              rm -f "$FOUND_ZIP"
            fi
          elif [ -d "${{ github.workspace }}/kernel/common/NoMount" ]; then
            echo "[+] Packaging NoMount directly from kernel source tree..."
            (cd "${{ github.workspace }}/kernel/common/NoMount" && zip -r9 "$TARGET_ZIP" . -x "*.git*" "out/*")
          else
            echo "[!] No NoMount source found to package."
          fi

      - name: Upload NoMount Module Artifact
        if: ${{ inputs.use_nomount }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-NoMount
          path: ${{ github.workspace }}/nomount-dist/
          if-no-files-found: ignore
          compression-level: 0

      - name: 📦 Package Root-Flavor Release Bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="/tmp/bundle-${{ matrix.flavor }}"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"

          # 1. Package AnyKernel3 Zip
          echo "[+] Adding AnyKernel3 zip to flavor bundle..."
          (cd "${{ github.workspace }}/AnyKernel3" && zip -r9 "$BUNDLE_DIR/${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-AnyKernel3.zip" . -x "*.git*")

          # 2. Add Matching Root Manager APK
          if [ -d "${{ github.workspace }}/root-managers" ]; then
            echo "[+] Adding matching Root Manager APKs..."
            cp -f "${{ github.workspace }}/root-managers/"*.apk "$BUNDLE_DIR/" 2>/dev/null || true
          fi

          # 3. Add NetHunter Wireless Module (if enabled)
          if [ -f "${{ github.workspace }}/Nethunter-Wireless-Modules.zip" ]; then
            echo "[+] Adding NetHunter Wireless Module..."
            cp -f "${{ github.workspace }}/Nethunter-Wireless-Modules.zip" "$BUNDLE_DIR/"
          fi

          # 4. Add NoMount Metamodule (if enabled)
          if [ -f "${{ github.workspace }}/nomount-dist/NoMount-${{ steps.extract.outputs.file_name }}.zip" ]; then
            echo "[+] Adding NoMount Metamodule..."
            cp -f "${{ github.workspace }}/nomount-dist/NoMount-${{ steps.extract.outputs.file_name }}.zip" "$BUNDLE_DIR/"
          elif [ -d "${{ github.workspace }}/nomount-dist" ]; then
            for z in "${{ github.workspace }}/nomount-dist/"*.zip; do
              if [ -f "$z" ]; then
                cp -f "$z" "$BUNDLE_DIR/"
                break
              fi
            done
          fi

          # 5. Add Summary Markdown
          if [ -f "/tmp/build-summary-${{ env.SUMMARY_BASE }}.md" ]; then
            cp -f "/tmp/build-summary-${{ env.SUMMARY_BASE }}.md" "$BUNDLE_DIR/"
          fi

          # Create the All-In-One Flavor Package ZIP
          PKG_NAME="${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-Bundle.zip"
          (cd "$BUNDLE_DIR" && zip -r9 "${{ github.workspace }}/$PKG_NAME" .)

          echo "[✓] Successfully created Flavor Bundle: $PKG_NAME"
          ls -la "$BUNDLE_DIR"

      - name: Upload Flavor Release Bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-Bundle
          path: ${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-Bundle.zip
          if-no-files-found: error
          compression-level: 0

  promote-pins:
    name: "Promote Verified Pins"
    needs: [build-kernel, resolve-sources]
    if: ${{ success() && inputs.commit_mode == 'update' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Promote Verified Pins
        shell: bash
        env:
          NOMOUNT_SHA: ${{ needs.resolve-sources.outputs.nomount_commit }}
          SUSFS_SHA: ${{ needs.resolve-sources.outputs.susfs_commit }}
          SUKISU_ULTRA_SHA: ${{ needs.resolve-sources.outputs.ultra_commit }}
          KERNELSU_NEXT_DEV_SHA: ${{ needs.resolve-sources.outputs.next_dev_commit }}
          APPROVE_NOMOUNT: ${{ inputs.use_nomount }}
          APPROVE_SUSFS: ${{ inputs.root_flavor == 'SukiSU-Ultra' }}
          APPROVE_SUKISU_ULTRA: ${{ inputs.root_flavor == 'SukiSU-Ultra' && inputs.ksu_branch == '' }}
          APPROVE_KERNELSU_NEXT_DEV: ${{ inputs.root_flavor == 'KernelSU-Next' && inputs.commit_mode == 'update' }}
        run: |
          set -euo pipefail
          echo "Promoting verified pins on successful build..."
          python3 .github/scripts/update_verified_pins.py
          if ! git diff --quiet .github/config/commits.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/config/commits.json .github/pins/history/
            git commit -m "chore(pins): promote verified dependency pins [skip ci]"
            git push origin HEAD:${{ github.ref }} || true
          fi

  release:
    name: "Create Release"
    needs: [build-kernel, resolve-sources]
    if: ${{ needs.build-kernel.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts/

      - name: Prepare Release Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/
          # Only publish the all-in-one Flavor Bundles to GitHub Releases
          find release-artifacts/ -name "*-Bundle.zip" -exec cp -f {} dist/ \;
          echo "Release assets prepared:"
          ls -la dist/

          RELEASE_NAME="Release #${{ github.run_number }} (${{ inputs.root_flavor }})"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"
          if [ "${{ inputs.root_flavor }}" = "SukiSU-Ultra" ]; then
            STEALTH_INFO="SUSFS v2.3.0"
          else
            STEALTH_INFO="SukiSU-specific in-tree SUSFS patch not applied to KernelSU-Next"
          fi
          if [ "${{ inputs.use_nomount }}" = "true" ]; then
            STEALTH_INFO="$STEALTH_INFO + NoMount VFS Metamodule"
          fi

          # Generate Release Notes
          RELEASE_BODY_FILE="release_notes.md"
          > "$RELEASE_BODY_FILE"

          if [ "${{ inputs.release_type }}" = "Pre-Release" ]; then
            echo "> [!WARNING]" >> "$RELEASE_BODY_FILE"
            echo "> ### ⚠️ Pre-Release / Experimental Build Notice" >> "$RELEASE_BODY_FILE"
            echo "> Flashing this kernel is **not recommended** for general use. This pre-release build is intended **only for developers and for testing**." >> "$RELEASE_BODY_FILE"
            echo ">" >> "$RELEASE_BODY_FILE"
            echo "> *Proceed with caution and ensure you have a backup of your stock boot image before proceeding.*" >> "$RELEASE_BODY_FILE"
            echo "" >> "$RELEASE_BODY_FILE"
          fi

          echo "## ⚡ Android 16 GKI Kernel (\`${{ inputs.kernel_target }}\`) — Release #${{ github.run_number }}" >> "$RELEASE_BODY_FILE"
          echo "" >> "$RELEASE_BODY_FILE"
          echo "### 📦 Build & Release Information" >> "$RELEASE_BODY_FILE"
          echo "- **Kernel Version:** \`${{ inputs.kernel_target }}-android16\`" >> "$RELEASE_BODY_FILE"
          echo "- **OS Patch Level:** \`${{ inputs.kernel_target == '6.12.38' && '2025-09' || '2025-07' }}\`" >> "$RELEASE_BODY_FILE"
          echo "- **Root Implementation:** \`${{ inputs.root_flavor }}\`" >> "$RELEASE_BODY_FILE"
          echo "- **Vendor Module Bypass:** Baked In (\`bad_version: return 1;\`)" >> "$RELEASE_BODY_FILE"
          echo "- **Stealth Integration:** ${STEALTH_INFO}" >> "$RELEASE_BODY_FILE"
          echo "- **NetHunter Driver Stack:** 75+ Wireless WiFi drivers (\`=m\`), BadUSB HID (\`/dev/hidg*\`), CAN-Bus & RTL-SDR" >> "$RELEASE_BODY_FILE"
          echo "" >> "$RELEASE_BODY_FILE"
          echo "### 📲 Flashing Instructions" >> "$RELEASE_BODY_FILE"
          echo "1. Download the all-in-one **\`*-Bundle.zip\`** matching your chosen root flavor and extract it." >> "$RELEASE_BODY_FILE"
          echo "2. Flash **\`*-AnyKernel3.zip\`** using the **[Kernel Flasher](https://github.com/fatalcoder524/KernelFlasher/releases)** app. *(Vendor module bypass is built-in)*" >> "$RELEASE_BODY_FILE"
          echo "3. Install the matching **Root Manager APK** (\`*.apk\`) included in the bundle." >> "$RELEASE_BODY_FILE"
          echo "4. Reboot your device." >> "$RELEASE_BODY_FILE"
          if [ "${{ inputs.root_flavor }}" = "SukiSU-Ultra" ]; then
            echo "5. *(Optional)* Flash **[susfs4ksu-module (by sidex15)](https://github.com/sidex15/susfs4ksu-module/releases)** in your Root Manager for additional root hiding." >> "$RELEASE_BODY_FILE"
          else
            echo "5. The builder skips the SukiSU-specific in-tree SUSFS patch for KernelSU-Next because its hunks do not apply to that upstream source." >> "$RELEASE_BODY_FILE"
          fi
          echo "6. *(Optional)* Flash **\`Nethunter-Wireless-Modules.zip\`** or **\`NoMount-*.zip\`** inside the Root Manager." >> "$RELEASE_BODY_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.kernel_target }}-android16-${{ inputs.root_flavor }}-${{ github.run_number }}"
          name: ${{ env.RELEASE_NAME }}
          draft: ${{ inputs.release_type == 'Draft' }}
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}
          files: dist/*
          body_path: release_notes.md
