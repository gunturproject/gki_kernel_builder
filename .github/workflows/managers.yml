name: Fetch Root Managers

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Root manager to download"
        type: choice
        options:
          - SukiSU-Ultra
          - KernelSU-Next
        default: SukiSU-Ultra
        required: true

jobs:
  fetch-managers:
    name: "Fetch ${{ inputs.flavor }} Manager APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Fetch Root Manager APK
        uses: ./.github/actions/fetch-root-managers
        with:
          flavor: ${{ inputs.flavor }}
          output_dir: ${{ github.workspace }}/root-managers

      - name: Upload Manager APKs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.flavor }}-Root-Manager-APKs
          path: ${{ github.workspace }}/root-managers/
          if-no-files-found: error
          compression-level: 0
